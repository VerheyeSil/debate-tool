[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "debate-tool"
version = "0.1.0"
description = "Simulate Dutch political debates between LLM agents that argue from each party's documented positions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sil Verheye" }]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
debate-tool = "debate_tool.cli:main"

[project.urls]
Repository = "https://github.com/VerheyeSil/debate-tool"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
debate_tool = ["data/parties/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
